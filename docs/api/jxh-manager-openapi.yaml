        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 冲突游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeConflictList'
        '400':
