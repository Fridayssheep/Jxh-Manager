openapi: 3.1.0
info:
  title: Jxh Manager Admin API
  version: 1.0.0
  description: |-
    Jxh Manager 管理面板与 Jxh-Go 同进程管理端之间的 HTTP 契约。
    所有资源 ID、QQ、群号和外部申请标识均使用字符串编码。
    尚未完成的接口通过 x-stage 和 x-status 标记，不表示当前服务已经实现。
  license:
    name: Private
    identifier: LicenseRef-Private
servers:
  - url: /api/admin/v1
    description: 相对当前管理端 Origin 的 API 基础路径
tags:
  - name: Auth
    description: 登录、当前身份和密码
  - name: Overview
    description: 管理总览
  - name: Groups
    description: NapCat 群目录
  - name: Settings
    description: 全局与群级功能设置
  - name: Join Requests
    description: 入群申请、决策和自动批准策略
  - name: Commands
    description: 受控自定义命令
  - name: Scheduled Jobs
    description: 定时任务和执行记录
  - name: Knowledge
    description: WPS 知识库状态和只读词条
  - name: Analytics
    description: 业务与运营统计
  - name: Audit
    description: 管理操作审计
  - name: Users
    description: 本地管理账号
  - name: Sessions
    description: 服务端会话
  - name: System
    description: 依赖状态和高风险系统动作
  - name: Events
    description: SSE 资源变化通知
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录管理端
      operationId: loginAdmin
      x-stage: phase_1
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，同时设置 jxh_admin_session Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly、Secure、SameSite=Strict 的服务端会话 Cookie
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/me:
    get:
      tags: [Auth]
      summary: 获取当前身份
      operationId: getCurrentAdmin
      x-stage: phase_1
      x-status: implemented
      responses:
        '200':
          description: 当前用户、会话、权限和 CSRF Token
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      operationId: logoutAdmin
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: 会话已经撤销，Cookie 已清除
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 清除 jxh_admin_session Cookie
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-logs:
    get:
      tags: [Audit]
      summary: 查询管理操作审计
      operationId: listAuditLogs
      x-stage: phase_1
      x-status: implemented
      parameters:
        - name: actor_user_id
          in: query
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: actor_type
          in: query
          schema:
            $ref: '#/components/schemas/AuditActorType'
        - name: action
          in: query
          schema:
            type: string
            maxLength: 100
        - name: target_type
          in: query
          schema:
            type: string
            maxLength: 64
        - name: target_id
          in: query
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: result
          in: query
          schema:
            $ref: '#/components/schemas/AuditResult'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 按时间倒序排列的脱敏审计记录游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-logs/{audit_log_id}:
    parameters:
      - $ref: '#/components/parameters/AuditLogId'
    get:
      tags: [Audit]
      summary: 获取管理操作审计详情
      description: 响应按当前操作者权限脱敏，永不返回密码、Token、密钥或完整申请验证消息。
      operationId: getAuditLog
      x-stage: phase_1
      x-status: implemented
      responses:
        '200':
          description: 脱敏后的审计详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      tags: [Users]
      summary: 查询管理账号
      description: 仅超级管理员可以调用。
      operationId: listAdminUsers
      x-stage: phase_1
      x-status: implemented
      parameters:
        - name: query
          in: query
          description: 匹配用户名、显示名称或完整 QQ
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/AdminRole'
        - name: enabled
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 管理账号游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: 创建管理账号
      description: 仅超级管理员可以调用。
      operationId: createAdminUser
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: 已创建的账号，不返回密码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: 获取管理账号
      description: 仅超级管理员可以调用。
      operationId: getAdminUser
      x-stage: phase_1
      x-status: implemented
      responses:
        '200':
          description: 管理账号详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: 修改管理账号
      description: 仅超级管理员可以调用；不能禁用或降级最后一个有效超级管理员。
      operationId: updateAdminUser
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPatchRequest'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /users/{user_id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: 重置管理账号密码
      description: 仅超级管理员可以调用。成功后目标账号的全部会话被撤销。
      operationId: resetAdminUserPassword
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: 密码已重置且会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /users/{user_id}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Sessions]
      summary: 撤销指定账号的全部会话
      description: 仅超级管理员可以调用。
      operationId: revokeAdminUserSessions
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 会话撤销结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions:
    get:
      tags: [Sessions]
      summary: 查询管理端会话
      description: 仅超级管理员可以调用；不返回 Cookie 或会话令牌摘要。
      operationId: listAdminSessions
      x-stage: phase_1
      x-status: implemented
      parameters:
        - name: user_id
          in: query
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - name: current
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 会话游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sessions/{session_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Sessions]
      summary: 撤销指定管理端会话
      description: 仅超级管理员可以调用。
      operationId: revokeAdminSession
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 会话撤销结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/health:
    get:
      tags: [System]
      summary: 获取管理端和依赖健康快照
      operationId: getSystemHealth
      x-stage: phase_1
      x-status: implemented
      responses:
        '200':
          description: 分依赖的健康、配置和新鲜度信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /system/napcat/restart:
    post:
      tags: [System]
      summary: 请求重启 NapCat
      description: 仅超级管理员可以调用。接口只返回受理状态，后续结果通过 SSE 或系统健康查询获得。
      operationId: restartNapCat
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NapCatRestartRequest'
      responses:
        '202':
          description: 重启请求已经受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /events:
    get:
      tags: [Events]
      summary: 订阅管理资源变化事件
      description: 使用 Cookie 会话的 SSE 流。服务端每 15 秒发送注释心跳；事件只用于失效通知，客户端收到后重新读取资源。
      operationId: subscribeAdminEvents
      x-stage: phase_1
      x-status: implemented
      parameters:
        - name: topic
          in: query
          description: 可重复传入一个或多个主题；省略时订阅当前用户有权读取的全部主题
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/EventTopic'
        - name: Last-Event-ID
          in: header
          description: 最近成功处理的 SSE 事件 ID
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Server-Sent Events 流
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                id: evt_01J4ZP8Y5M5E6A
                event: join_request.updated
                retry: 3000
                data: {"event_id":"evt_01J4ZP8Y5M5E6A","event":"join_request.updated","occurred_at":"2026-07-27T08:31:01Z","resource":{"type":"join_request","id":"jr_01J4ZP7","version":6},"reason":"decision_confirmed"}
              x-sse-data-schema:
                $ref: '#/components/schemas/AdminEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/change-password:
    post:
      tags: [Auth]
      summary: 修改当前用户密码
      description: 成功后撤销其他会话，并轮换当前 Session Cookie 和 CSRF Token。
      operationId: changeOwnPassword
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码修改成功并返回轮换后的认证上下文
          headers:
            Set-Cookie:
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /overview:
    get:
      tags: [Overview]
      summary: 获取管理总览
      operationId: getOverview
      x-stage: phase_1
      x-status: implemented
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d]
            default: 7d
        - name: group_id
          in: query
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: 总览指标、待处理事项、依赖摘要和趋势
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /groups:
    get:
      tags: [Groups]
      summary: 查询群目录
      operationId: listGroups
      x-stage: phase_1
      x-status: implemented
      parameters:
        - name: query
          in: query
          description: 匹配群名或完整群号
          schema:
            type: string
            maxLength: 100
        - name: bot_role
          in: query
          schema:
            $ref: '#/components/schemas/GroupRole'
        - name: snapshot_state
          in: query
          schema:
            type: string
            enum: [fresh, stale]
        - name: feature_key
          in: query
          schema:
            $ref: '#/components/schemas/FeatureKey'
        - name: feature_enabled
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 群目录游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /groups/sync:
    post:
      tags: [Groups]
      summary: 立即同步群目录
      operationId: syncGroups
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 群目录同步完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: 获取群详情
      operationId: getGroup
      x-stage: phase_1
      x-status: implemented
      responses:
        '200':
          description: 群快照和能力摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings:
    get:
      tags: [Settings]
      summary: 获取全局功能设置
      operationId: getGlobalSettings
      x-stage: phase_1
      x-status: implemented
      responses:
        '200':
          description: 完整全局设置文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Settings]
      summary: 更新全局功能设置
      operationId: updateGlobalSettings
      x-stage: phase_1
      x-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalSettingsPatch'
      responses:
        '200':
          description: 更新后的全局设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /groups/{group_id}/settings:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Settings]
      summary: 获取群级有效设置和覆盖
      operationId: getGroupSettings
      x-stage: phase_1
