          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/timeseries:
    get:
      tags: [Analytics]
      summary: 获取统计时间序列
      operationId: getAnalyticsTimeseries
      x-stage: phase_2
