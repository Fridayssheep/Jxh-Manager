            type: string
            enum: [hour, day]
        - name: metric
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items:
              $ref: '#/components/schemas/AnalyticsMetricKey'
      responses:
        '200':
          description: 按粒度聚合的一个或多个指标序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTimeseries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/rankings:
    get:
      tags: [Analytics]
      summary: 获取统计排行
      operationId: getAnalyticsRankings
      x-stage: phase_2
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsGroupIds'
        - $ref: '#/components/parameters/AnalyticsFeatureKey'
        - $ref: '#/components/parameters/AnalyticsResult'
        - $ref: '#/components/parameters/AnalyticsTimezone'
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            enum: [group, command, knowledge_entry]
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AnalyticsMetricKey'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 稳定 key、展示名称、值和排名
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsRankings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/export:
    get:
      tags: [Analytics]
      summary: 流式导出统计数据
      operationId: exportAnalytics
      x-stage: phase_2
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsGroupIds'
        - $ref: '#/components/parameters/AnalyticsFeatureKey'
        - $ref: '#/components/parameters/AnalyticsResult'
        - $ref: '#/components/parameters/AnalyticsTimezone'
        - name: dataset
          in: query
          required: true
          schema:
            type: string
            enum: [summary, timeseries, rankings, join_requests, scheduled_job_runs]
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
        - name: granularity
          in: query
          schema:
            type: string
            enum: [hour, day]
        - name: metric
          in: query
          schema:
            $ref: '#/components/schemas/AnalyticsMetricKey'
        - name: dimension
          in: query
          schema:
            type: string
            enum: [group, command, knowledge_entry]
      responses:
        '200':
          description: CSV 或 XLSX 文件流
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment 文件名
            X-Export-Row-Count:
              schema:
                type: integer
                minimum: 0
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jxh_admin_session
      description: HttpOnly 服务端会话 Cookie；响应体不会返回其值。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 登录或 /auth/me 返回、仅由前端保存在内存中的 CSRF Token。
  headers:
    RequestId:
      description: 用于关联 API、审计和上游调用日志的请求 ID
      schema:
        $ref: '#/components/schemas/Identifier'
    RetryAfter:
      description: 建议重试等待秒数
      schema:
        type: integer
        minimum: 1
  parameters:
    Cursor:
      name: cursor
      in: query
      description: 由服务端签发且绑定当前筛选和排序条件的不透明游标
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 资源 version 的带双引号十进制表示，例如 "7"
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一操作者和 operation 下用于副作用去重的客户端生成键
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    JoinRequestId:
      name: request_id
      in: path
      required: true
      description: NapCat 申请 flag 的字符串表示
      schema:
        $ref: '#/components/schemas/JoinRequestIdentifier'
    CommandId:
      name: command_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ScheduledJobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    KnowledgeEntryId:
      name: entry_id
      in: path
      required: true
      description: source key 的 URL-safe 不透明编码
      schema:
        $ref: '#/components/schemas/Identifier'
    AuditLogId:
      name: audit_log_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    AnalyticsFrom:
      name: from
      in: query
      description: 聚合起点；省略时由服务端按接口默认时间范围计算
      schema:
        type: string
        format: date-time
    AnalyticsTo:
      name: to
      in: query
      description: 聚合终点，不得早于 from
      schema:
        type: string
        format: date-time
    AnalyticsGroupIds:
      name: group_id
      in: query
      description: 可重复传入多个群号
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        uniqueItems: true
        items:
          $ref: '#/components/schemas/Identifier'
    AnalyticsFeatureKey:
      name: feature_key
      in: query
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/FeatureKey'
    AnalyticsResult:
      name: result
      in: query
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [success, failed, denied, unknown, fallback, skipped]
    AnalyticsTimezone:
      name: timezone
      in: query
      description: IANA 时区名
      schema:
        type: string
        maxLength: 64
        default: Asia/Shanghai
  responses:
    BadRequest:
      description: 请求语法、字段或筛选条件无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_failed
              message: 请求字段校验失败
              request_id: req_01J4ZP8Y
              fields:
                name: [格式不正确]
              retryable: false
    Unauthorized:
      description: 未登录、会话过期或会话已撤销
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthenticated
              message: 请重新登录
              request_id: req_01J4ZP8Y
              fields: {}
              retryable: false
    Forbidden:
      description: CSRF 校验失败或当前角色无权执行操作
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: permission_denied
              message: 当前账号无权执行此操作
              request_id: req_01J4ZP8Y
              fields: {}
              retryable: false
    NotFound:
      description: 资源不存在或当前用户不可见
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: resource_not_found
              message: 资源不存在
              request_id: req_01J4ZP8Y
              fields: {}
              retryable: false
    Conflict:
      description: 资源版本、幂等键、唯一约束或业务状态冲突
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resourceVersionConflict:
              value:
                error:
                  code: resource_version_conflict
                  message: 资源已经被其他操作更新
                  request_id: req_01J4ZP8Y
                  fields: {}
                  retryable: false
            idempotencyKeyReused:
              value:
                error:
                  code: idempotency_key_reused
                  message: 幂等键已用于不同参数
                  request_id: req_01J4ZP8Y
                  fields: {}
                  retryable: false
    PreconditionRequired:
      description: 修改已有资源时缺少 If-Match
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: precondition_required
              message: 请求必须携带 If-Match
              request_id: req_01J4ZP8Y
              fields: {}
              retryable: false
    TooManyRequests:
      description: 请求频率过高
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: 请求过于频繁，请稍后重试
              request_id: req_01J4ZP8Y
              fields: {}
              retryable: true
    BadGateway:
      description: 上游返回明确失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: upstream_failure
              message: 上游服务未能完成操作
              request_id: req_01J4ZP8Y
              fields: {}
              retryable: true
    ServiceUnavailable:
      description: 必需依赖当前不可用，业务动作尚未开始
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: dependency_unavailable
              message: NapCat 当前不可用
              request_id: req_01J4ZP8Y
              fields: {}
              retryable: true
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 256
      description: 不透明字符串标识；客户端不得推断前缀、长度或编码含义。
    JoinRequestIdentifier:
      type: string
      minLength: 1
      maxLength: 512
      description: NapCat 原始申请 flag；服务端不得截断、哈希、重编码或生成平行标识。
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 时间点
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, fields, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: 稳定机器错误码；客户端必须为未知值提供通用降级显示。
        message:
          type: string
          maxLength: 500
        request_id:
          $ref: '#/components/schemas/Identifier'
        fields:
          type: object
          description: 字段路径到一条或多条安全校验消息的映射
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 300
        retryable:
          type: boolean
    AdminRole:
      type: string
      enum: [super_admin, maintainer, observer]
    Permission:
      type: string
      enum:
        - overview:read
        - groups:read
        - groups:sync
        - settings:read
        - settings:write
        - join_requests:read
        - join_requests:decide
        - join_policies:write
        - commands:read
        - commands:write
        - scheduled_jobs:read
        - scheduled_jobs:write
        - knowledge:read
        - knowledge:reload
        - analytics:read
        - analytics:export
        - audit:read
        - users:manage
        - sessions:manage
        - system:read
        - napcat:restart
        - events:read
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z][a-z0-9_.-]{2,31}$'
    Password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
      writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          $ref: '#/components/schemas/Password'
        new_password:
          $ref: '#/components/schemas/Password'
    AdminUser:
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - display_name
        - role
        - qq_user_id
        - enabled
        - last_login_at
        - created_at
        - updated_at
        - version
      properties:
        user_id:
          $ref: '#/components/schemas/Identifier'
        username:
          $ref: '#/components/schemas/Username'
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        role:
          $ref: '#/components/schemas/AdminRole'
        qq_user_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 32
          description: 可选且全局唯一的 QQ 维护身份绑定
        enabled:
          type: boolean
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
    SessionStatus:
      type: string
      enum: [active, expired, revoked]
    AdminSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - user_id
        - status
        - current
        - ip_address
        - user_agent
        - created_at
        - last_seen_at
        - expires_at
        - revoked_at
      properties:
        session_id:
          $ref: '#/components/schemas/Identifier'
        user_id:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/SessionStatus'
        current:
          type: boolean
        ip_address:
          type: string
          maxLength: 64
        user_agent:
          type: string
          maxLength: 300
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          oneOf:
